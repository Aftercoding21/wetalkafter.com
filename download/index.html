<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Get the After app</title>
<meta name="description" content="After is a free app where people who are grieving talk to others who have lived a similar loss. No AI, only people.">
<meta property="og:title" content="Get the After app">
<meta property="og:description" content="A free app where people who are grieving talk to others who understand. No AI, only people.">
<meta property="og:image" content="https://wetalkafter.com/og.png">
<meta property="og:url" content="https://wetalkafter.com/download/">
<meta property="og:type" content="website">
<meta name="theme-color" content="#ECE7DF">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<script>
  // Smart download link. Phones go straight to their store; everything else sees this page.
  // Counting: adds one to a daily total by source (?src=, e.g. ig-bio) and device type.
  // No cookies, nothing stored about the person (see the privacy page).
  (function () {
    var APP_STORE = "https://apps.apple.com/app/id6827635162"; // no country: each person lands on their own store
    var PLAY = "https://play.google.com/store/apps/details?id=com.aftercoding21.after";
    var ua = navigator.userAgent || "";
    var iPadOS = /Macintosh/.test(ua) && navigator.maxTouchPoints > 1; // iPads report as a Mac
    var inApp = /Instagram|FBAN|FBAV|FB_IAB|FBIOS/.test(ua);
    var device = (/iPhone|iPad|iPod/.test(ua) || iPadOS) ? "iphone" : /Android/i.test(ua) ? "android" : "computer";
    var src = "direct";
    try { src = (new URLSearchParams(location.search).get("src") || "direct").toLowerCase().slice(0, 30); } catch (e) {}

    var counted;
    try {
      counted = fetch("https://lnnvivctgxniahykocyy.supabase.co/rest/v1/rpc/count_download_tap", {
        method: "POST", keepalive: true, credentials: "omit", referrerPolicy: "no-referrer",
        headers: { "apikey": "sb_publishable_3WmR6rapfDtYVo3x7rxvEg_HF8UzhUA", "Content-Type": "application/json" },
        body: JSON.stringify({ p_src: src, p_device: device })
      }).catch(function () {});
    } catch (e) { counted = Promise.resolve(); }

    var target = device === "iphone" ? APP_STORE
      : device === "android" ? (inApp
          // Inside Instagram/Facebook, ask Android to open the Play Store app, with the web page as fallback.
          ? "intent://details?id=com.aftercoding21.after#Intent;scheme=market;package=com.android.vending;S.browser_fallback_url=" + encodeURIComponent(PLAY) + ";end"
          : PLAY)
      : null;
    if (target) {
      // Wait for the count at most 0.6 s, so nobody waits for it.
      var done = false;
      var go = function () { if (!done) { done = true; window.location.replace(target); } };
      Promise.resolve(counted).then(go, go);
      setTimeout(go, 600);
    }
  })();
</script>
<link rel="stylesheet" href="/fonts.css">
<style>
  :root {
    --cream: #ECE7DF; --paper: #F6F3EE; --forest: #2F4436; --brown: #875A47; --ink: #2A2B28; --muted: #5F5B55;
    --serif: "Newsreader", Georgia, "Times New Roman", serif;
    --sans: "DM Sans", -apple-system, system-ui, "Helvetica Neue", sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body { background: var(--cream); color: var(--ink); font: 400 17px/1.6 var(--sans);
    min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 32px 16px; }
  main { width: 100%; max-width: 460px; background: var(--paper); border-radius: 16px; padding: 36px 28px; text-align: center; }
  .mark { display: block; width: 110px; height: auto; margin: 0 auto 20px; }
  h1 { font: 400 34px/1.15 var(--serif); color: var(--forest); margin: 0 0 12px; }
  p { margin: 0 0 14px; }
  .stores { display: flex; flex-wrap: wrap; justify-content: center; gap: 10px; margin: 22px 0 24px; }
  .store { display: inline-flex; flex-direction: column; justify-content: center; min-width: 150px; padding: 8px 16px;
    border: 1.5px solid var(--forest); border-radius: 10px; color: var(--forest); text-decoration: none; text-align: left; }
  .store:hover { background: var(--forest); color: #fff; }
  .store-name { font: 600 16px/1.2 var(--sans); }
  .store-small { font-size: 12px; letter-spacing: 0.08em; text-transform: uppercase; }
  .qr { display: block; width: 160px; height: 160px; margin: 0 auto 8px; }
  .fine { font-size: 14px; color: var(--muted); margin: 0; }
  a:focus-visible { outline: 2px solid var(--brown); outline-offset: 3px; }
</style>
</head>
<body>
<main>
  <img class="mark" src="/images/wordmark.png" width="93" height="32" alt="After">
  <h1>Get the After app</h1>
  <p>Talk with real people who have lived a similar loss. Free, no AI, only people.</p>
  <div class="stores" role="group" aria-label="Get the After app">
    <a class="store" href="https://apps.apple.com/app/id6827635162"><span class="store-small">Download on the</span><span class="store-name">App Store</span></a>
    <a class="store" href="https://play.google.com/store/apps/details?id=com.aftercoding21.after"><span class="store-small">Get it on</span><span class="store-name">Google Play</span></a>
  </div>
  <img class="qr" src="/download/qr.svg" width="160" height="160" alt="QR code to get After on your phone">
  <p class="fine">On a computer? Scan this with your phone's camera.</p>
</main>
</body>
</html>
