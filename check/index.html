<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>After · quick check</title>
<style>
  html, body { margin: 0; background: transparent; }
  body { display: flex; justify-content: center; align-items: flex-start; padding-top: 4px; }
</style>
<script src="https://challenges.cloudflare.com/turnstile/v0/api.js?onload=go&render=explicit" async defer></script>
</head>
<body>
<div id="w"></div>
<script>
  // The After app opens this page in a small web view for the "I'm a person"
  // check, and gets the Cloudflare token back. Nothing else happens here.
  var p = new URLSearchParams(location.search);
  function send(m) {
    var s = JSON.stringify(m);
    if (window.ReactNativeWebView) window.ReactNativeWebView.postMessage(s);
    else if (window.parent !== window) window.parent.postMessage(s, '*');
  }
  function go() {
    turnstile.render('#w', {
      sitekey: '0x4AAAAAAFQoLMx0Y7IBp_Zd',
      language: p.get('lang') || 'auto',
      theme: 'light',
      callback: function (t) { send({ token: t }); },
      'error-callback': function () { send({ error: true }); },
      'expired-callback': function () { send({ error: true }); },
      'timeout-callback': function () { send({ error: true }); }
    });
  }
</script>
</body>
</html>
