<script>
  // Smart download link: iPhone/iPad -> App Store, Android -> Google Play, anything else -> /try/.
  (function () {
    var ua = navigator.userAgent || "";
    var iPadOS = /Macintosh/.test(ua) && navigator.maxTouchPoints > 1; // iPads report as a Mac
    var url = "/try/";
    if (/iPhone|iPad|iPod/.test(ua) || iPadOS) url = "https://apps.apple.com/app/id6827635162";
    else if (/Android/i.test(ua)) url = "https://play.google.com/store/apps/details?id=com.aftercoding21.after";
    window.location.replace(url);
  })();
</script>
