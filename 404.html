<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
<title>After</title>
<style>html,body{margin:0;height:100%;background:#ECE7DF}</style>
<script>
// GitHub Pages shows this page for any address it has no file for.
// Inside /try (the web test version) that happens on refresh, back and
// forward on an inner screen like /try/settings: load the current
// /try/index.html in its place, so the app opens on that screen. It never
// points at a particular build, so it can't go out of date.
// Anywhere else, go to the home page.
(function () {
  if (!/^\/try(\/|$)/.test(location.pathname)) { location.replace("/"); return; }
  fetch("/try/index.html", { cache: "no-store" })
    .then(function (r) { if (!r.ok) throw new Error(); return r.text(); })
    .then(function (html) { document.open(); document.write(html); document.close(); })
    .catch(function () { location.replace("/try/"); });
})();
</script>
</head>
<body></body>
</html>
